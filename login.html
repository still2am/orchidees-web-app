<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Orchidées</title>
    <link href="https://fonts.cdnfonts.com/css/mango-vintage-personal-use-only" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/alice-2" rel="stylesheet">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" href="images/icon.png">
</head>
<body class="background-img">
    <div class="logo text-center mt-2">
        <h2 class="mb-0">Orchidées</h2>
    </div>
    <div class="formbox animation text-center mt-4">
        <div class="container">
            <div class="row col-md-8 mb-md-3 mt-sm-0 mt-4 mx-auto">
                <h1 class="mb-5">Вход</h1>
                <form id="loginForm">
                    <div class="form-floating mb-2 mb-md-3">
                        <input type="email" name="email" class="form-control" id="emailInput" placeholder="Email" required>
                        <label for="emailInput">Электронная почта</label>
                    </div>
                    <div class="form-floating mb-2 mb-md-3">
                        <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Password" required>
                        <label for="passwordInput">Пароль</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                    <div id="errorMessage" style="color: #dc3545; margin-top: 15px; display: none; font-weight: bold; text-align: center;">
                        Ошибка входа: неверный логин или пароль
                    </div>
                </form>
                <p class="mt-4">Нет аккаунта? <a class="ms-1" href="register.html">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
    <script src="JS/login.js"></script>
</body>
</html>
