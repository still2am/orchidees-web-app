<!DOCTYPE html>
<html lang="ru">

<head>
    <title>Оформление заказа</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.cdnfonts.com/css/mango-vintage-personal-use-only" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/alice-2" rel="stylesheet">

    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="icon" href="images/icon.png">
</head>

<body class="background-img" id="checkout">
    <nav class="p-3 mb-0">
        <ul class="d-flex justify-content-around align-items-center mb-0">
            <li><a href="home.html">Главная</a></li>
            <li><a href="profile.html">Личный кабинет</a></li>
            <li class="none">
                <h2 class="mb-0">Orchidées</h2>
            </li>
            <li><a href="products.html">Товары</a></li>
            <li><a href="contact.html">Контакты</a></li>
        </ul>
    </nav>

    <div class="container_checkout" id="main-div">
        <form id="checkoutForm">
            <h2>Оформление заказа</h2>
            
            <div class="checkout-flex-row">
                
                <div class="checkout-flex-col width-40">
                    <div class="checkout-flex-row">
                        <div class="checkout-flex-col width-40">
                            <div>
                                <label for="firstName"><h4>Имя</h4></label><br>
                                <input id="firstName" type="text" name="firstName" required>
                            </div>
                            <div>
                                <label for="lastName"><h4>Фамилия</h4></label><br>
                                <input id="lastName" type="text" name="lastName" required>
                            </div>
                            <div>
                                <label for="address"><h4>Адрес доставки</h4></label><br>
                                <input id="address" type="text" name="address" required>
                            </div>
                            <div>
                                <label for="phoneNumber"><h4>Номер телефона</h4></label><br>
                                <input id="phoneNumber" type="text" name="phoneNumber" required>
                            </div>
                        </div>

                        <div class="checkout-flex-col width-40">
                            <div>
                                <label for="deliveryDate"><h4>Дата доставки</h4></label><br>
                                <input type="date" id="deliveryDate" name="date" required>
                            </div>
                            <div>
                                <label for="notes"><h4>Комментарий к заказу</h4></label><br>
                                <textarea id="notes" name="notes"></textarea>
                            </div>
                        </div>
                    </div>

                    <div id="checkout_submit">
                        <input type="submit" value="Оформить заказ">
                        <p>Примечание: Оплата производится при получении</p>
                    </div>
                </div>

                <div id="order_details">
                    <img src="./images/p1 (1).jpg" height="400px" id="orderImg">
                    <div class="text">
                        <p id="flowerName"></p>
                        <span id="flowerPrice"></span> 
                    </div>
                    <p><strong>Доставка:</strong></p>
                    <p>Будни: 200 ₽ | Выходные: 500 ₽</p>
                </div>
            </div>
        </form>
    </div>

    <script src="JS/order.js"></script>
</body>
</html>
