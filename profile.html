<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link href="https://fonts.cdnfonts.com/css/mango-vintage-personal-use-only" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/alice-2" rel="stylesheet">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="images/icon.png">
</head>
<body class="background-img contact-body">
    <nav class="p-3 mb-0">
        <ul class="d-flex justify-content-around align-items-center mb-0">
            <li><a href="home.html">Главная</a></li>
            <li><a href="profile.html">Личный кабинет</a></li>
            <li class="none"><h2 class="mb-0">Orchidées</h2></li>
            <li><a href="products.html">Товары</a></li>
            <li><a href="contact.html">Контакты</a></li>
        </ul>
    </nav>

    <div class="container my-5 py-4 animation">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="contact-form p-4 text-center text-white" style="background: rgba(0, 0, 0, 0.6); border-radius: 10px;">
                    <div class="avatar-block mb-3"><i class="fa-solid fa-circle-user fa-7x text-white-50"></i></div>
                    <h3 id="userName" class="mb-1">Загрузка...</h3>
                    <div class="d-grid gap-2">
                        <button id="logoutBtn" class="btn btn-danger btn-sm mt-3">Выйти из аккаунта</button>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="settings" class="contact-form p-4 mb-4" style="background: rgba(255, 255, 255, 0.95); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <h2 class="mb-4 text-dark" style="font-family: 'Alice', serif;">Мои данные</h2>
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label text-dark small fw-bold">Имя</label><input type="text" id="firstname" name="firstname" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label text-dark small fw-bold">Фамилия</label><input type="text" id="lastname" name="lastname" class="form-control" required></div>
                        </div>
                        <div class="mb-3"><label class="form-label text-dark small fw-bold">Электронная почта</label><input type="email" id="email" name="email" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label text-dark small fw-bold">Телефон</label><input type="tel" id="phone" name="phone" class="form-control" required></div>
                        <button type="submit" class="btn btn-dark w-100" style="background-color: #000; border: none;">Сохранить изменения</button>
                    </form>
                </div>

                <div id="ordersBlock" class="contact-form p-4" style="background: rgba(255, 255, 255, 0.95); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <h2 class="mb-4 text-dark" style="font-family: 'Alice', serif;">Мои заказы</h2>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Товар</th>
                                <th>Дата</th>
                                <th>Цена</th>
                                <th>Статус</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="orderModal" class="modal-overlay">
        <div class="modal-content-box">
            <span onclick="closeModal()" style="position: absolute; top: 10px; right: 20px; cursor: pointer; font-size: 30px;">&times;</span>
            <h3 class="text-dark">Детали заказа</h3>
            <hr>
            <div id="modalContent" class="text-dark"></div>
        </div>
    </div>

    <script src="JS/profile.js"></script>
</body>
</html>
